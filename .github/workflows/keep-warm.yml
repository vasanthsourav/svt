# Keeps the Render free-tier service awake during shopping hours.
#
# Render suspends a free service after 15 minutes without inbound traffic, and
# waking it takes about a minute — which is what customers experience as the site
# "getting stuck" on first load. Pinging it more often than every 15 minutes
# prevents the sleep in the first place.
#
# Why only part of the day: a Render workspace gets 750 free instance-hours per
# calendar month and a 31-day month is 744 hours, so keeping the service up 24/7
# leaves almost no headroom — and that budget is shared by EVERY free service in
# the workspace. The shop's hours are 06:00–23:00 IST: render-schedule.yml
# resumes the service at 05:30 IST and suspends it at 23:00 IST, and this pings
# only in between (00:10–17:20 UTC = 05:40–22:50 IST). Pinging a suspended
# service would just fail.
#
# /api/health is deliberately the target: it reads env vars only and makes NO
# database query, so this keeps Render awake without also keeping the Neon
# database awake and burning its separate free compute-hour allowance.
#
# Note GitHub may run scheduled jobs late under load. render-schedule.yml
# re-enables this workflow daily so the 60-day inactivity rule never turns it off.

name: Keep site warm

on:
  schedule:
    - cron: '10-59/10 0 * * *'  # 00:10–00:50 UTC
    - cron: '*/10 1-16 * * *'   # 01:00–16:50 UTC
    - cron: '0-20/10 17 * * *'  # 17:00–17:20 UTC (suspend is at 17:30)
  workflow_dispatch:             # lets you trigger a wake-up by hand

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        run: |
          # --max-time 90 because a cold start legitimately takes ~60s; the point
          # of this request is to BE the wake-up when the service has dropped off.
          code=$(curl -sSL -o /tmp/body.txt -w '%{http_code}' --max-time 90 \
            https://www.svtkvp.in/api/health || echo 000)
          echo "HTTP $code"
          cat /tmp/body.txt || true
          echo
          if [ "$code" != "200" ]; then
            echo "::error::Health check returned $code"
            exit 1
          fi
