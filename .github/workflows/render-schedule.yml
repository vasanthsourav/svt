# Opens the shop for the day and closes it overnight, so the Render free tier
# never runs out of hours before the month ends.
#
# A Render workspace gets 750 free instance-hours per calendar month, and any
# request wakes the service — including bots at 3am, each costing at least 15
# minutes. Pinging alone can't stop those night-time wake-ups from draining the
# allowance. A SUSPENDED service counts no hours and ignores traffic, so:
#
#   resume  00:00 UTC (05:30 IST) — 30 min early, because GitHub often starts
#                                   scheduled jobs late, and a cold start takes ~1 min
#   suspend 17:30 UTC (23:00 IST)
#
# That is ~17.5 h/day ≈ 545 h in a 31-day month, leaving ~200 h of headroom.
# Overnight, visitors see Render's "service suspended" page.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   RENDER_API_KEY     Render dashboard → Account Settings → API Keys
#   RENDER_SERVICE_ID  the srv-… id in the svt-shop service's dashboard URL
#
# GitHub disables scheduled workflows after 60 days without repo activity; the
# last step re-enables this workflow and keep-warm.yml every run to prevent that.

name: Open and close the shop

on:
  schedule:
    - cron: '0 0 * * *'     # 05:30 IST → resume
    - cron: '30 17 * * *'   # 23:00 IST → suspend
  workflow_dispatch:
    inputs:
      action:
        description: 'resume or suspend'
        required: true
        default: resume
        type: choice
        options: [resume, suspend]

permissions:
  actions: write   # for the keep-alive step below

jobs:
  toggle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Decide action
        id: pick
        run: |
          if [ -n "${{ inputs.action }}" ]; then
            action="${{ inputs.action }}"
          elif [ "${{ github.event.schedule }}" = "30 17 * * *" ]; then
            action=suspend
          else
            action=resume
          fi
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "Action: $action"

      - name: Call Render API
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          code=$(curl -sS -o /tmp/body.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/${{ steps.pick.outputs.action }}" || echo 000)
          echo "HTTP $code"; cat /tmp/body.txt || true; echo
          # Resuming a service that is already running answers 400 "only services
          # suspended by a user can be resumed" — fine, the wake step below still
          # checks the site really answers.
          if [ "${code#2}" != "$code" ]; then
            exit 0
          elif [ "$code" = "400" ] && grep -q 'only services suspended by a user' /tmp/body.txt; then
            echo "Already running."
          else
            echo "::error::Render API returned $code"; exit 1
          fi

      - name: Wake the site after resuming
        if: steps.pick.outputs.action == 'resume'
        run: |
          # Resuming triggers a fresh start; poll until it answers so the shop
          # is already warm when customers arrive.
          for i in $(seq 1 16); do
            code=$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 60 \
              https://www.svtkvp.in/api/health || echo 000)
            echo "Attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "::error::Site did not come up after resume"
          exit 1

      - name: Keep scheduled workflows enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in render-schedule.yml keep-warm.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable" || true
          done
